<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140e0b">
<title>FIRE</title>
<link rel="icon" href="icon.png" type="image/png">
<style>
  :root {
    --bg: #fff6f0; --panel: #ffffff; --panel2: #fff0e6; --text: #2a1a12; --muted: #8a6f60; --line: #f0dccf;
    --fire1: #ffb300; --fire2: #ff6a1a; --fire3: #e8261d;
    --grad: linear-gradient(135deg, var(--fire1) 0%, var(--fire2) 50%, var(--fire3) 100%);
    --on-fire: #fff; --theirs: #ffffff; --theirs-text: #2a1a12; --shadow: 0 8px 30px rgba(232, 80, 20, .18);
    --ok: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #120d0b; --panel: #1c1512; --panel2: #261b16; --text: #f6ebe4; --muted: #a58f82; --line: #33241d;
      --theirs: #2a1e18; --theirs-text: #f6ebe4; --shadow: 0 8px 40px rgba(255, 90, 20, .20);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  .logo { display: block; }
  button { font-family: inherit; }

  /* ---------- Acceso ---------- */
  #s-auth { background:
      radial-gradient(120% 60% at 50% 0%, rgba(255, 106, 26, .28) 0%, transparent 60%), var(--bg);
    overflow-y: auto; }
  .hero { text-align: center; margin: auto auto 0; padding: 32px 20px 8px; }
  .hero-logo { width: 190px; height: 190px; border-radius: 50%; display: block; margin: 0 auto;
    box-shadow: 0 0 60px rgba(255, 106, 26, .45), 0 0 0 2px rgba(255, 140, 40, .25); }
  .hero p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
  .auth { margin: 22px auto auto; width: min(380px, 92vw); background: var(--panel); padding: 22px; border-radius: 22px;
    border: 1px solid var(--line); box-shadow: var(--shadow); }
  .auth h2 { margin: 0 0 4px; font-size: 20px; }
  .auth label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .auth input { width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--panel2); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
  .auth input:focus { border-color: var(--fire2); box-shadow: 0 0 0 4px rgba(255, 106, 26, .18); }
  .btn { width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; font-weight: 700; letter-spacing: .3px; border: 0; border-radius: 12px;
    background: var(--grad); color: var(--on-fire); cursor: pointer; box-shadow: 0 6px 18px rgba(232, 80, 20, .35); }
  .btn:active { transform: translateY(1px); filter: brightness(.95); }
  .link { background: none; border: 0; color: var(--fire2); margin-top: 12px; width: 100%; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px; }
  .error { color: #ef4444; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .demo { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 24px; padding: 0 20px; }
  .hero, .auth, .demo { flex: none; }

  /* Pantallas bajas (visor pequeño, teléfono en horizontal): todo más compacto */
  @media (max-height: 760px) {
    .hero { padding: 16px 20px 0; margin-top: 0; }
    .hero-logo { width: 110px; height: 110px; }
    .hero p { margin-top: 8px; font-size: 14px; }
    .auth { margin-top: 14px; padding: 16px 18px; }
    .auth label { margin: 10px 0 4px; }
    .auth input { padding: 11px 12px; }
    .btn { margin-top: 12px; padding: 12px; }
    .error { min-height: 14px; margin-top: 6px; }
  }

  /* ---------- Barra superior ---------- */
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line); position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--grad); }
  header .brand { display: flex; align-items: center; gap: 8px; flex: 1; }
  header .brand-logo { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 12px rgba(255, 106, 26, .5); }
  header .brand span { font-weight: 800; font-size: 20px; letter-spacing: 5px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header h2 { font-size: 17px; margin: 0; font-weight: 700; line-height: 1.1; }
  header .who { flex: 1; min-width: 0; }
  header .who small { color: var(--muted); font-size: 12px; }
  .icon-btn { background: transparent; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .icon-btn:active { background: var(--panel2); }
  .icon-btn.back { color: var(--fire2); font-size: 26px; line-height: 1; padding: 2px 10px 6px; }

  /* ---------- Lista de chats ---------- */
  #users { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .user { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; cursor: pointer; }
  .user:active { background: var(--panel2); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--grad); color: #fff; flex: none; position: relative;
    display: grid; place-items: center; font-weight: 800; font-size: 19px; text-transform: uppercase; }
  .avatar.sm { width: 38px; height: 38px; font-size: 16px; }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: #8b7d75; border: 3px solid var(--bg); }
  .dot.on { background: var(--ok); }
  .user .info { min-width: 0; flex: 1; }
  .user .name { font-weight: 700; }
  .user .sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--grad); color: #fff; border-radius: 12px; min-width: 24px; padding: 2px 8px; font-size: 13px; font-weight: 800; text-align: center; }
  .empty { padding: 50px 24px; text-align: center; color: var(--muted); }

  /* ---------- Conversación ---------- */
  #messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px;
    background: radial-gradient(90% 40% at 50% 100%, rgba(255, 106, 26, .10), transparent 70%); }
  #messages:empty::before { content: "Escribe el primer mensaje 🔥"; margin: auto; color: var(--muted); font-size: 15px; }
  .msg { max-width: 80%; padding: 9px 13px 6px; border-radius: 18px 18px 18px 5px; background: var(--theirs); color: var(--theirs-text);
    border: 1px solid var(--line); word-wrap: break-word; white-space: pre-wrap; align-self: flex-start; }
  .msg.mine { align-self: flex-end; background: var(--grad); color: #fff; border: 0; border-radius: 18px 18px 5px 18px;
    box-shadow: 0 4px 14px rgba(232, 80, 20, .25); }
  .msg time { display: block; font-size: 11px; opacity: .65; text-align: right; margin-top: 2px; }
  form.send { display: flex; gap: 8px; align-items: center; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line); }
  form.send input { flex: 1; padding: 13px 16px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 24px;
    background: var(--panel2); color: var(--text); outline: none; }
  form.send input:focus { border-color: var(--fire2); }
  form.send svg { width: 22px; height: 22px; }

  /* ---------- Fotos, audios y grabación ---------- */
  form.send { position: relative; }
  form.send[hidden] { display: none; }
  form.send button.round, .rec button.round { width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--grad); color: #fff;
    cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(232, 80, 20, .35); flex: none; }
  form.send button.ghost { background: var(--panel2); color: var(--muted); box-shadow: none; border: 1.5px solid var(--line); }
  form.send button.round svg, .rec button.round svg { width: 22px; height: 22px; }
  form.send #send-btn { display: none; }
  form.send.has-text #send-btn { display: grid; }
  form.send.has-text #mic { display: none; }

  .rec { display: flex; align-items: center; gap: 10px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line); }
  .rec[hidden] { display: none; }
  .rec .icon-btn { font-size: 18px; color: var(--muted); }
  .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; animation: pulse 1s infinite; }
  #rec-time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec-hint { flex: 1; color: var(--muted); font-size: 14px; }
  @keyframes pulse { 50% { opacity: .25; } }

  .msg.media { padding: 4px 4px 4px; }
  .msg.media time { padding: 0 8px 2px; }
  .photo { display: block; width: 100%; max-width: 250px; max-height: 320px; object-fit: cover; border-radius: 14px; cursor: zoom-in; }
  .msg.voice { min-width: 220px; }
  .audio { display: flex; align-items: center; gap: 10px; }
  .audio .play { width: 36px; height: 36px; border-radius: 50%; border: 0; flex: none; cursor: pointer; font-size: 13px; font-weight: 700;
    background: var(--grad); color: #fff; display: grid; place-items: center; }
  .msg.mine .audio .play { background: #fff; color: var(--fire3); }
  .audio .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(128, 128, 128, .35); cursor: pointer; position: relative; }
  .audio .fill { height: 100%; width: 0; border-radius: 3px; background: var(--fire2); }
  .msg.mine .audio .fill { background: #fff; }
  .atime { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .85; min-width: 34px; text-align: right; }

  #viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); display: grid; place-items: center; z-index: 20; cursor: zoom-out; }
  #viewer[hidden] { display: none; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: #2a1e18; color: #fff;
    padding: 10px 16px; border-radius: 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; max-width: 90vw; text-align: center;
    border: 1px solid rgba(255, 106, 26, .5); }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  /* ---------- Menú "+", ubicación y confirmación ---------- */
  .menu { position: absolute; left: 10px; bottom: calc(100% + 8px); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 6px; box-shadow: var(--shadow); z-index: 10; min-width: 170px; }
  .menu[hidden] { display: none; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  form.send .menu .mitem { display: flex; align-items: center; gap: 12px; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; color: var(--text); }
  form.send .menu .mitem:active { background: var(--panel2); }
  form.send .menu button { width: 100%; height: auto; border-radius: 12px; background: none; color: var(--text); box-shadow: none; border: 0;
    display: flex; align-items: center; gap: 12px; padding: 12px; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; }
  form.send .menu button:active { background: var(--panel2); }
  .menu .mi { font-size: 20px; }

  .msg.loc { padding: 6px; min-width: 230px; }
  .msg.loc time { padding: 0 8px 2px; }
  .locard { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; text-decoration: none; color: inherit;
    background: rgba(128, 128, 128, .14); }
  .locard .pin { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; flex: none;
    background: radial-gradient(circle at 50% 40%, rgba(255, 179, 0, .45), rgba(232, 38, 29, .25)); }
  .locard .t { font-weight: 700; }
  .locard .s { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
  .locard .go { font-size: 13px; font-weight: 700; margin-top: 2px; text-decoration: underline; }

  #confirm { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: grid; place-items: center; z-index: 25; padding: 20px; }
  #confirm[hidden] { display: none; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; width: min(340px, 100%); box-shadow: var(--shadow); }
  .dialog h3 { margin: 0 0 8px; font-size: 18px; }
  .dialog p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog button { border: 0; border-radius: 12px; padding: 11px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .dialog .plain { background: none; color: var(--muted); white-space: nowrap; }
  .dialog .btn-sm { background: var(--grad); color: #fff; }

  /* ---------- Documentos, videos, aviso y campana ---------- */
  .msg.file { padding: 6px; min-width: 230px; max-width: 86%; }
  .msg.file time { padding: 0 8px 2px; }
  .filecard { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer;
    background: rgba(128, 128, 128, .14); }
  .filecard:active { filter: brightness(.9); }
  .filecard .ext { width: 44px; height: 52px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 800;
    letter-spacing: .5px; color: #fff; background: linear-gradient(160deg, #7c6a60, #4a3d36); }
  .filecard .ext.pdf { background: linear-gradient(160deg, #ef4444, #b91c1c); }
  .filecard .ext.doc { background: linear-gradient(160deg, #3b82f6, #1d4ed8); }
  .filecard .ext.xls { background: linear-gradient(160deg, #22c55e, #15803d); }
  .filecard .ext.ppt { background: linear-gradient(160deg, #fb923c, #c2410c); }
  .filecard .fn { min-width: 0; }
  .filecard .name { font-weight: 700; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .filecard .size { font-size: 12px; opacity: .8; }
  .filecard .tap { font-size: 12px; font-weight: 700; text-decoration: underline; }

  .vthumb { position: relative; width: 250px; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; cursor: pointer;
    background: #1b1411; display: grid; place-items: center; }
  .vthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vthumb .playbtn { position: relative; width: 52px; height: 52px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff;
    display: grid; place-items: center; font-size: 20px; padding-left: 3px; border: 2px solid rgba(255, 255, 255, .8); }
  .vthumb .vdur { position: absolute; right: 8px; bottom: 6px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, .55);
    padding: 1px 7px; border-radius: 8px; }

  #viewer video { max-width: 100%; max-height: 100%; background: #000; }
  #viewer video[hidden], #viewer img[hidden] { display: none; }
  #viewer-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: rgba(255, 255, 255, .15); color: #fff; font-size: 18px; cursor: pointer; z-index: 2; }

  #banner { position: fixed; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 40; background: var(--panel);
    border: 1px solid rgba(255, 106, 26, .6); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); cursor: pointer;
    display: flex; align-items: center; gap: 10px; animation: drop .25s ease-out; }
  #banner[hidden] { display: none; }
  #banner .avatar { width: 36px; height: 36px; font-size: 15px; }
  #banner .bt { min-width: 0; }
  #banner .bn { font-weight: 800; font-size: 14px; }
  #banner .bb { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
  #bell { font-size: 18px; padding: 6px 8px; }

  /* ---------- Avatares con foto y pantalla de perfil ---------- */
  .avatar { overflow: visible; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .avatar.xl { width: 128px; height: 128px; font-size: 52px; cursor: pointer; box-shadow: 0 0 40px rgba(255, 106, 26, .35); }
  .hdr-avatar { border: 2px solid rgba(255, 140, 40, .8); padding: 0; cursor: pointer; font: inherit; color: #fff; flex: none; }
  .pbody { flex: 1; overflow-y: auto; padding: 22px 20px 30px; width: min(480px, 100%); margin: 0 auto; }
  .pavatar { position: relative; width: 128px; margin: 6px auto 4px; }
  .pavatar .cam { position: absolute; right: -6px; bottom: 2px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--bg);
    background: var(--grad); font-size: 18px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .pbody .link { display: block; margin: 4px auto 6px; width: auto; }
  .pbody .link[hidden] { display: none; }
  .field { margin-top: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel2);
    color: var(--text); outline: none; }
  .field input:focus { border-color: var(--fire2); box-shadow: 0 0 0 4px rgba(255, 106, 26, .18); }
  .field input[readonly] { opacity: .65; }
  .field small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  details.pw { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px 16px; background: var(--panel); }
  details.pw summary { padding: 14px 0 6px; font-weight: 700; cursor: pointer; }
  .ghost-btn { background: var(--panel2); color: var(--text); box-shadow: none; border: 1.5px solid var(--line); }
  .admin-note { font-size: 13px; color: var(--muted); background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .acct { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .acct .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acct .nm { font-weight: 700; }
  .acct .em { font-size: 14px; color: var(--muted); word-break: break-all; }
  .acct .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); }
  .tag.ok { background: rgba(34,197,94,.18); color: #16a34a; } .tag.warn { background: rgba(255,179,0,.2); color: #b45309; } .tag.bad { background: rgba(239,68,68,.18); color: #dc2626; }
  .acct .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acct .acts button { flex: 1; border: 1.5px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .acct .acts .danger { color: #dc2626; border-color: rgba(239,68,68,.5); }
  .out-btn { margin-top: 26px; background: none; color: #ef4444; box-shadow: none; border: 1.5px solid rgba(239, 68, 68, .5); }

  /* ---------- Cuenta: código por correo ---------- */
  #s-verify { background: radial-gradient(120% 60% at 50% 0%, rgba(255, 106, 26, .28) 0%, transparent 60%), var(--bg); overflow-y: auto; }
  .vicon { font-size: 56px; text-align: center; margin: auto auto 0; padding-top: 28px; flex: none; }
  .v-text { color: var(--muted); font-size: 15px; margin: 6px 0 4px; }
  #v-code { font-size: 30px; letter-spacing: 12px; text-align: center; font-weight: 800; padding: 14px 8px 14px 20px; }
  .simbox { background: rgba(255, 179, 0, .12); border: 1px dashed rgba(255, 179, 0, .75); border-radius: 12px; padding: 10px 12px;
    font-size: 13px; margin: 10px 0 2px; }
  .simbox b { display: block; font-size: 26px; letter-spacing: 8px; margin-top: 4px; color: var(--fire1); font-variant-numeric: tabular-nums; }
  .auth [hidden] { display: none !important; }
  .link.sub { color: var(--muted); font-weight: 500; margin-top: 2px; }
  .link:disabled { opacity: .6; cursor: default; }
  .btn:disabled { opacity: .6; }
</style>
</head>
<body>

  <div class="auth">
    <h2 id="auth-title">Entrar</h2>
    <div id="row-name"><label for="name">Nombre</label>
    <input id="name" maxlength="30" autocomplete="name" placeholder="Cómo te verán los demás"></div>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" inputmode="email" autocapitalize="none" autocomplete="email" placeholder="tucorreo@ejemplo.com">
    <div id="row-pass"><label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 8, con letras y números"></div>
    <div id="row-pass2"><label for="password2">Repite la contraseña</label>
    <input id="password2" type="password" autocomplete="new-password"></div>
    <div class="error" id="auth-error"></div>
    <button type="button" class="btn" id="auth-btn">Entrar</button>
    <button type="button" class="link" id="auth-toggle">No tengo cuenta · Crear una</button>
    <button type="button" class="link sub" id="auth-forgot">¿Olvidaste tu contraseña?</button>
  </div>
  <div class="demo" id="demo-note"></div>
</section>

<section id="s-verify" class="screen">

    <p class="v-text" id="v-text"></p>
    <div class="simbox" id="v-sim" hidden></div>
    <label for="v-code">Código de 6 dígitos</label>
    <input id="v-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <div id="v-newpw-row" hidden>
      <label for="v-newpw">Contraseña nueva</label>
      <input id="v-newpw" type="password" autocomplete="new-password" placeholder="Mínimo 8, con letras y números">
      <label for="v-newpw2">Repite la contraseña nueva</label>
      <input id="v-newpw2" type="password" autocomplete="new-password">
    </div>
    <div class="error" id="v-error"></div>
    <button type="button" class="btn" id="v-btn">Confirmar correo</button>
    <button type="button" class="link" id="v-resend">Reenviar código</button>
    <button type="button" class="link sub" id="v-back">Volver</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase || document.write('<script src="supabase.js"><\/script>');</script>
<script>
(() => {
  'use strict';
  /* Conexión con el servidor. Con la URL y la clave puestas, la app usa Supabase (cuentas reales, correo real, mensajes entre teléfonos).
     La clave "publishable" es pública por diseño: la seguridad la dan las reglas de la base de datos (supabase_setup.sql). */
  const FIRE_CONFIG = {
    supabaseUrl: 'https://arrposwwomulxfpuxbbw.supabase.co',
    supabaseKey: 'sb_publishable_KcCqbdtWdGJWKiKtCIiNGw_i6S7swIP',
  };
  const MAX_DATA = 900 * 1024;           // fotos y audios van dentro del mensaje
  const MAX_FILE = 10 * 1024 * 1024;     // videos y documentos
  const BLOCKED = /\.(apk|exe|bat|cmd|msi|sh|scr|jar|com|vbs|ps1|dll)$/i;
  const previewOf = (m) => ({ image: '📷 Foto', audio: '🎤 Mensaje de voz', location: '📍 Ubicación',
    video: '🎬 Video', file: '📄 ' + (m.name || 'Documento') }[m.type] || m.text || '');

const LocalBackend = (() => {
  // localStorage puede no estar disponible en algunas vistas previas: usamos memoria como respaldo.
  const mem = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch {} },
  };
  const BOT = 'Eco';
  // Correos con permiso de administrador (cuando se conecte el servidor real, el permiso se guarda allí, no en la app)
  const ADMIN_EMAILS = ['tediopoemas@gmail.com'];
  const isAdminAcc = (a) => !!a && ADMIN_EMAILS.includes(a.email);
  const handlers = {};
  const emit = (ev, data) => (handlers[ev] || []).forEach((fn) => fn(data));
  let me = null; // id de la cuenta con sesión iniciada

  const accounts = () => store.get('demo_accounts', {});
  const saveAccounts = (a) => store.set('demo_accounts', a);
  const msgs = () => store.get('demo_msgs', []);
  const norm = (s) => String(s || '').trim();
  const uid = () => Math.random().toString(36).slice(2) + Date.now();
  const normEmail = (e) => norm(e).toLowerCase();
  const validEmail = (e) => e.length <= 120 && /^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/.test(e);
  const checkPass = (p) => {
    p = String(p);
    if (p.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres');
    if (!/[a-zA-Z]/.test(p) || !/\d/.test(p)) throw new Error('La contraseña debe tener letras y números');
  };
  const byEmail = (email) => Object.values(accounts()).find((a) => a.email === email);
  const push = (m) => { const all = msgs(); all.push(m); store.set('demo_msgs', all.slice(-300)); };

  /* ---- Códigos de un solo uso (en modo de prueba se simulan; en producción los envía el proveedor de correo) ---- */
  const CODE_TTL = 10 * 60 * 1000;   // vence a los 10 minutos
  const RESEND_WAIT = 60 * 1000;     // 1 minuto entre envíos
  const MAX_TRIES = 5;               // intentos por código
  const codes = () => store.get('demo_codes', {});
  function issueCode(email, purpose, force) {
    const all = codes(), prev = all[email];
    if (!force && prev && Date.now() - prev.sent < RESEND_WAIT) throw new Error('Espera ' + Math.ceil((RESEND_WAIT - (Date.now() - prev.sent)) / 1000) + ' s para pedir otro código');
    const buf = new Uint32Array(1); crypto.getRandomValues(buf);
    all[email] = { code: String(buf[0] % 1000000).padStart(6, '0'), purpose, exp: Date.now() + CODE_TTL, sent: Date.now(), tries: 0 };
    store.set('demo_codes', all);
  }
  function checkCode(email, purpose, code) {
    const all = codes(), c = all[email];
    if (!c || c.purpose !== purpose) throw new Error('Pide un código nuevo');
    if (Date.now() > c.exp) { delete all[email]; store.set('demo_codes', all); throw new Error('El código venció. Pide uno nuevo'); }
    if (c.tries >= MAX_TRIES) { delete all[email]; store.set('demo_codes', all); throw new Error('Demasiados intentos. Pide un código nuevo'); }
    if (norm(code) !== c.code) { c.tries++; store.set('demo_codes', all); throw new Error('Código incorrecto (' + (MAX_TRIES - c.tries) + ' intentos restantes)'); }
    delete all[email]; store.set('demo_codes', all);
  }
  const fails = {}; // intentos fallidos de entrada por correo
  function startSession(a) {
    if (a.blocked) throw new Error('Esta cuenta está bloqueada. Contacta al administrador.');
    const all = accounts(); if (all[a.id]) { all[a.id].lastLogin = Date.now(); saveAccounts(all); }
    me = a.id; store.set('demo_session2', a.id); return { username: a.id }; }

  // Otras pestañas del mismo navegador (sirve para probar con dos usuarios a la vez)
  window.addEventListener('storage', (e) => {
    if (e.key !== 'demo_msgs' || !me) return;
    try {
      const all = JSON.parse(e.newValue || '[]');
      const known = new Set(JSON.parse(e.oldValue || '[]').map((m) => m.id));
      all.filter((m) => !known.has(m.id) && (m.to === me || m.from === me)).forEach((m) => emit('message', m));
    } catch {}
  });

  // Archivos grandes (documentos y videos): IndexedDB; si no está disponible, memoria.
  const fileStore = (() => {
    const memFiles = new Map();
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('fire-files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('f');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    }));
    return {
      async put(id, blob) {
        memFiles.set(id, blob);
        try { const db = await open(); await new Promise((res, rej) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch {}
      },
      async get(id) {
        if (memFiles.has(id)) return memFiles.get(id);
        try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); } catch { return null; }
      },
    };
  })();

  return {
    name: 'local',
    note: 'Modo de prueba: los datos se guardan solo en este dispositivo y el correo es simulado.',
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    init() {
      me = store.get('demo_session2', null);
      if (me && !accounts()[me]) me = null;
      return me ? { username: me } : null;
    },

    /* ---- Cuentas ---- */
    async register({ name, email, password }) {
      name = norm(name).slice(0, 30); email = normEmail(email);
      if (name.length < 2) throw new Error('Escribe tu nombre (mínimo 2 letras)');
      if (!validEmail(email)) throw new Error('Escribe un correo válido');
      checkPass(password);
      const all = accounts(), ex = Object.values(all).find((a) => a.email === email);
      if (ex && ex.verified) throw new Error('Ya existe una cuenta con ese correo. Entra o recupera tu contraseña.');
      if (ex) { ex.displayName = name; ex.password = password; } // cuenta sin confirmar: se actualiza
      else { const id = 'u_' + uid(); all[id] = { id, email, displayName: name, password, verified: false, about: '', photo: '', created: Date.now() }; }
      saveAccounts(all);
      issueCode(email, 'signup', true);
      return { pending: true, email };
    },
    async verify(email, code, purpose = 'signup') {
      email = normEmail(email);
      checkCode(email, purpose, code);
      const all = accounts(), a = Object.values(all).find((x) => x.email === email);
      if (!a) throw new Error('Cuenta no encontrada');
      a.verified = true; saveAccounts(all);
      return startSession(a);
    },
    async resend(email, purpose = 'signup') {
      email = normEmail(email);
      const a = byEmail(email);
      if (purpose === 'reset' && !(a && a.verified)) return { pending: true }; // no revelamos si el correo existe
      if (!a) throw new Error('Cuenta no encontrada');
      issueCode(email, purpose);
      return { pending: true };
    },
    async login({ email, password }) {
      email = normEmail(email);
      const lock = fails[email];
      if (lock && lock.until > Date.now()) throw new Error('Demasiados intentos. Espera ' + Math.ceil((lock.until - Date.now()) / 1000) + ' s');
      const a = byEmail(email);
      if (!a || a.password !== password) {
        const f = (fails[email] = fails[email] || { n: 0, until: 0 });
        if (++f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
        throw new Error('Correo o contraseña incorrectos');
      }
      delete fails[email];
      if (!a.verified) {
        try { issueCode(email, 'signup', true); } catch {}
        const e = new Error('Tu correo aún no está confirmado.'); e.unverified = true; e.email = email; throw e;
      }
      return startSession(a);
    },
    async requestReset(email) {
      email = normEmail(email);
      if (!validEmail(email)) throw new Error('Escribe un correo válido');
      const a = byEmail(email);
      if (a && a.verified) issueCode(email, 'reset');
      return { pending: true, email }; // misma respuesta exista o no el correo
    },
    async resetPassword(email, code, newPassword) {
      email = normEmail(email);
      checkPass(newPassword);
      checkCode(email, 'reset', code);
      const all = accounts(), a = Object.values(all).find((x) => x.email === email);
      if (!a) throw new Error('Cuenta no encontrada');
      a.password = newPassword; saveAccounts(all);
    },
    logout() { me = null; store.del('demo_session2'); },

    /* Solo para el modo de prueba: muestra el código que "se envió" (un proveedor real no tiene esto) */
    peekCode(email) {

    async updateProfile(p) {

      }
      saveAccounts(all);

    },
    async changePassword(oldP, newP) {
      const all = accounts(), a = all[me];
      if (!a || a.password !== oldP) throw new Error('La contraseña actual no es correcta');
      checkPass(newP);
      a.password = newP; saveAccounts(all);

    async send(to, p) {

      } else if (m.type === 'file' || m.type === 'video') {
        const f = p.file;
        if (!f || !f.size) throw new Error('Archivo no válido');
        if (f.size > MAX_FILE) throw new Error('El archivo supera el límite de 10 MB');
        if (BLOCKED.test(p.name || '')) throw new Error('Este tipo de archivo no está permitido');
        m.name = String(p.name || 'archivo').slice(0, 120);
        m.mime = String(p.mime || f.type || 'application/octet-stream').slice(0, 100);
        m.size = f.size;
        if (m.type === 'video') {
          m.dur = Math.round(p.dur || 0);
          if (typeof p.poster === 'string' && p.poster.startsWith('data:image/') && p.poster.length < 60000) m.poster = p.poster;
        }
        await fileStore.put(m.id, f);
      } else if (m.type === 'location') {
        const lat = Number(p.lat), lng = Number(p.lng);

        m.lat = lat; m.lng = lng; m.acc = Math.round(Number(p.acc) || 0);
      } else {
        if (!p.data || p.data.length > MAX_DATA) throw new Error('El archivo es demasiado grande');
        m.data = p.data;
        if (m.type === 'audio') m.dur = p.dur || 0;
      }
      push(m); emit('message', m);
      if (to === BOT) { // Eco devuelve lo mismo que le envías, para poder probar
        setTimeout(async () => {
          const r = { ...m, id: uid(), from: BOT, to: me, ts: Date.now() };
          if (r.type === 'text') r.text = 'Eco: ' + r.text;
          if (r.type === 'file' || r.type === 'video') await fileStore.put(r.id, await fileStore.get(m.id));
          push(r); emit('message', r);
        }, 700);
      }
    },
  };
})();





/* ================= Conexión con Supabase (cuentas reales, mensajes entre teléfonos, administración) ================= */
const SupabaseBackend = !window.supabase ? null : (() => {
  const cfg = FIRE_CONFIG;
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  const handlers = {};
  const emit = (ev, data) => (handlers[ev] || []).forEach((fn) => fn(data));
  let me = null, myEmail = '', inbox = null, presence = null, online = new Set();

  const norm = (s) => String(s || '').trim();
  const normEmail = (e) => norm(e).toLowerCase();
  const validEmail = (e) => e.length <= 120 && /^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/.test(e);
  const checkPass = (p) => {
    p = String(p);
    if (p.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres');
    if (!/[a-zA-Z]/.test(p) || !/\d/.test(p)) throw new Error('La contraseña debe tener letras y números');
  };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));

  // Traduce los errores de Supabase a mensajes claros
  function fail(err) {
    const m = String((err && err.message) || err || ''), c = String((err && err.code) || '');
    let t = m;
    if (c === 'email_not_confirmed' || /not confirmed/i.test(m)) { const e = new Error('Tu correo aún no está confirmado.'); e.unverified = true; return e; }
    if (/invalid login/i.test(m)) t = 'Correo o contraseña incorrectos';
    else if (c === 'user_banned' || /banned/i.test(m)) t = 'Esta cuenta está bloqueada. Contacta al administrador.';
    else if (/already registered/i.test(m) || c === 'user_already_exists') t = 'Ya existe una cuenta con ese correo. Entra o recupera tu contraseña.';
    else if (/rate limit/i.test(m) || /security purposes/i.test(m) || c === 'over_email_send_rate_limit' || c === 'over_request_rate_limit') t = 'Demasiados intentos. Espera un minuto e inténtalo de nuevo.';
    else if (c === 'otp_expired' || /expired|invalid/i.test(m) && /token|otp/i.test(m)) t = 'Código incorrecto o vencido. Pide uno nuevo.';
    else if (c === 'same_password' || /different from the old/i.test(m)) t = 'La contraseña nueva debe ser distinta de la anterior';
    else if (c === 'weak_password') t = 'La contraseña es demasiado débil';
    else if (/failed to fetch|network/i.test(m)) t = 'Sin conexión. Revisa tu internet.';
    return new Error(t);
  }
  const must = ({ data, error }) => { if (error) throw fail(error); return data; };

  const rowToMsg = (r) => ({ id: r.id, from: r.from_id, to: r.to_id, type: r.type, ts: Date.parse(r.created_at) || Date.now(), ...(r.body || {}) });

  function connect() {
    if (!me || inbox) return;
    inbox = sb.channel('inbox-' + me)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'to_id=eq.' + me },
        (p) => emit('message', rowToMsg(p.new)))
      .subscribe();
    presence = sb.channel('presence-fire', { config: { presence: { key: me } } });
    presence.on('presence', { event: 'sync' }, () => { online = new Set(Object.keys(presence.presenceState())); emit('presence'); })
      .subscribe(async (st) => { if (st === 'SUBSCRIBED') { try { await presence.track({ at: Date.now() }); } catch {} } });
  }
  function disconnect() {
    try { if (inbox) sb.removeChannel(inbox); if (presence) sb.removeChannel(presence); } catch {}
    inbox = presence = null; online = new Set();
  }
  function open(session) {
    me = session.user.id; myEmail = session.user.email || '';
    connect();
    return { username: me };
  }

  return {
    note: '',
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },

    // Restaura la sesión guardada (es asíncrono)
    async init() {
      try {
        const { data } = await sb.auth.getSession();
        return data && data.session ? open(data.session) : null;
      } catch { return null; }
    },

    async register({ name, email, password }) {
      name = norm(name).slice(0, 30); email = normEmail(email);
      if (name.length < 2) throw new Error('Escribe tu nombre (mínimo 2 letras)');
      if (!validEmail(email)) throw new Error('Escribe un correo válido');
      checkPass(password);
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
      if (error) throw fail(error);
      // Si el correo ya tiene una cuenta confirmada, Supabase no da error: devuelve un usuario sin identidades
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0)
        throw new Error('Ya existe una cuenta con ese correo. Entra o recupera tu contraseña.');
      return { pending: true, email };
    },

    async verify(email, code, purpose = 'signup') {
      const { data, error } = await sb.auth.verifyOtp({ email: normEmail(email), token: norm(code), type: purpose === 'reset' ? 'recovery' : 'signup' });
      if (error) throw fail(error);
      if (!data || !data.session) throw new Error('No se pudo iniciar la sesión');
      return open(data.session);
    },

    async resend(email, purpose = 'signup') {
      email = normEmail(email);
      if (purpose === 'reset') { await sb.auth.resetPasswordForEmail(email); return { pending: true }; }
      const { error } = await sb.auth.resend({ type: 'signup', email });
      if (error) throw fail(error);
      return { pending: true };
    },

    async login({ email, password }) {
      email = normEmail(email);
      const { data, error } = await sb.auth.signInWithPassword({ email, password: String(password) });
      if (error) {
        const e = fail(error);
        if (e.unverified) { try { await sb.auth.resend({ type: 'signup', email }); } catch {} e.email = email; }
        throw e;
      }
      return open(data.session);
    },

    async requestReset(email) {
      email = normEmail(email);
      if (!validEmail(email)) throw new Error('Escribe un correo válido');
      const { error } = await sb.auth.resetPasswordForEmail(email);
      if (error && /rate|security purposes/i.test(error.message || '')) throw fail(error);
      return { pending: true, email }; // misma respuesta exista o no el correo
    },

    async resetPassword(email, code, newPassword) {
      checkPass(newPassword);
      const { error } = await sb.auth.verifyOtp({ email: normEmail(email), token: norm(code), type: 'recovery' });
      if (error) throw fail(error);
      const up = await sb.auth.updateUser({ password: String(newPassword) });
      if (up.error) { await sb.auth.signOut(); throw fail(up.error); }
      await sb.auth.signOut();
    },

    logout() { disconnect(); me = null; myEmail = ''; sb.auth.signOut().catch(() => {}); },

    async getProfile() {
      const p = must(await sb.from('profiles').select('display_name, about, photo, is_admin').eq('id', me).single());
      return { username: me, email: myEmail, displayName: p.display_name || '', about: p.about || '', photo: p.photo || '', isAdmin: !!p.is_admin };
    },

    async updateProfile(p) {
      const up = {};
      if ('displayName' in p) {
        const n = norm(p.displayName).slice(0, 30);
        if (!n) throw new Error('El nombre no puede estar vacío');
        up.display_name = n;
      }
      if ('about' in p) up.about = norm(p.about).slice(0, 80);
      if ('photo' in p) {
        if (!p.photo) up.photo = '';
        else {
          if (!/^data:image\/(jpeg|png|webp);base64,/.test(p.photo) || p.photo.length > 60000) throw new Error('La foto es demasiado grande');
          up.photo = p.photo;
        }
      }
      if (Object.keys(up).length) must(await sb.from('profiles').update(up).eq('id', me));
      return this.getProfile();
    },

    async changePassword(oldP, newP) {
      const chk = await sb.auth.signInWithPassword({ email: myEmail, password: String(oldP) });
      if (chk.error) throw new Error('La contraseña actual no es correcta');
      checkPass(newP);
      const { error } = await sb.auth.updateUser({ password: String(newP) });
      if (error) throw fail(error);
    },

    async listUsers() {
      connect();
      const people = must(await sb.from('profiles').select('id, display_name, about, photo').neq('id', me)) || [];
      const rows = must(await sb.from('messages').select('*').or('from_id.eq.' + me + ',to_id.eq.' + me).order('created_at', { ascending: false }).limit(300)) || [];
      const last = {};
      for (const r of rows) { const other = r.from_id === me ? r.to_id : r.from_id; if (!last[other]) last[other] = r; }
      return people.map((u) => ({ username: u.id, displayName: u.display_name, about: u.about || '', photo: u.photo || '',
        online: online.has(u.id), last: last[u.id] ? previewOf(rowToMsg(last[u.id])) : '' }));
    },

    async loadMessages(other) {
      const rows = must(await sb.from('messages').select('*')
        .or('and(from_id.eq.' + me + ',to_id.eq.' + other + '),and(from_id.eq.' + other + ',to_id.eq.' + me + ')')
        .order('created_at', { ascending: false }).limit(200)) || [];
      return rows.reverse().map(rowToMsg);
    },

    async getFile(m) {
      if (!m.path) return null;
      const { data, error } = await sb.storage.from('files').download(m.path);
      if (error) throw fail(error);
      return data;
    },

    async send(to, p) {
      const id = newId(), type = p.type || 'text', body = {};
      if (type === 'text') {
        body.text = norm(p.text).slice(0, 2000);
        if (!body.text) return;
      } else if (type === 'file' || type === 'video') {
        const f = p.file;
        if (!f || !f.size) throw new Error('Archivo no válido');
        if (f.size > MAX_FILE) throw new Error('El archivo supera el límite de 10 MB');
        if (BLOCKED.test(p.name || '')) throw new Error('Este tipo de archivo no está permitido');
        body.name = String(p.name || 'archivo').slice(0, 120);
        body.mime = String(p.mime || f.type || 'application/octet-stream').slice(0, 100);
        body.size = f.size;
        if (type === 'video') {
          body.dur = Math.round(p.dur || 0);
          if (typeof p.poster === 'string' && p.poster.startsWith('data:image/') && p.poster.length < 60000) body.poster = p.poster;
        }
        body.path = me + '/' + id;
        const up = await sb.storage.from('files').upload(body.path, f, { contentType: body.mime, upsert: false });
        if (up.error) throw fail(up.error);
      } else if (type === 'location') {
        const lat = Number(p.lat), lng = Number(p.lng);
        if (!(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) throw new Error('Ubicación no válida');
        body.lat = lat; body.lng = lng; body.acc = Math.round(Number(p.acc) || 0);
      } else {
        if (!p.data || p.data.length > MAX_DATA) throw new Error('El archivo es demasiado grande');
        body.data = p.data;
        if (type === 'audio') body.dur = p.dur || 0;
      }
      const { error } = await sb.from('messages').insert({ id, from_id: me, to_id: to, type, body });
      if (error) throw fail(error);
      emit('message', { id, from: me, to, type, ts: Date.now(), ...body });
    },

    /* ---- Administración: la seguridad la aplica el servidor (funciones SQL que exigen is_admin) ---- */
    async adminListUsers() {
      const rows = must(await sb.rpc('admin_list_users')) || [];
      return rows.map((r) => ({ id: r.id, email: r.email, displayName: r.display_name || '(sin nombre)', verified: !!r.confirmed, blocked: !!r.blocked,
        created: Date.parse(r.created_at) || 0, lastLogin: Date.parse(r.last_sign_in_at) || 0, admin: !!r.is_admin, sent: Number(r.sent) || 0 }));
    },
    async adminSetBlocked(id, blocked) { must(await sb.rpc('admin_set_blocked', { target: id, blocked: !!blocked })); },
    async adminDelete(id) { must(await sb.rpc('admin_delete_user', { target: id })); },
  };
})();

  /* Audio: un solo reproductor activo a la vez */
  let playing = null;

  function audioPlayer(m) {
    const wrap = document.createElement('div'); wrap.className = 'audio';
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'play'; btn.textContent = '▶'; btn.setAttribute('aria-label', 'Reproducir');
    const bar = document.createElement('div'); bar.className = 'bar';
    const fill = document.createElement('div'); fill.className = 'fill'; bar.appendChild(fill);
    const time = document.createElement('span'); time.className = 'atime'; time.textContent = fmt(m.dur);
    const a = new Audio(m.data); a.preload = 'metadata';
    const total = () => (isFinite(a.duration) && a.duration > 0 ? a.duration : m.dur || 0);
    btn.onclick = () => {
      if (a.paused) { if (playing && playing !== a) playing.pause(); playing = a; a.play().catch(() => toast('No se pudo reproducir el audio')); }
      else a.pause();
    };
    a.onplay = () => (btn.textContent = '❚❚');
    a.onpause = () => (btn.textContent = '▶');
    a.ontimeupdate = () => { const t = total(); fill.style.width = t ? (a.currentTime / t) * 100 + '%' : '0'; time.textContent = fmt(t - a.currentTime); };
    a.onended = () => { fill.style.width = '0'; time.textContent = fmt(total()); btn.textContent = '▶'; };
    bar.onclick = (e) => { const r = bar.getBoundingClientRect(); const t = total(); if (t) a.currentTime = ((e.clientX - r.left) / r.width) * t; };
    wrap.append(btn, bar, time);
    return wrap;
  }

  function bubble(m) {
    const d = document.createElement('div');
    d.className = 'msg' + (m.from === session.username ? ' mine' : '');
    if (m.type === 'image') {
      d.classList.add('media');

      img.onclick = () => openViewer({ img: m.data });

    } else if (m.type === 'audio') {
      d.classList.add('voice');
      d.appendChild(audioPlayer(m));
    } else if (m.type === 'video') {
      d.classList.add('media');
      const v = document.createElement('div'); v.className = 'vthumb'; v.setAttribute('role', 'button');
      if (typeof m.poster === 'string' && m.poster.startsWith('data:image/')) { const im = document.createElement('img'); im.src = m.poster; im.alt = ''; v.appendChild(im); }

    } else if (m.type === 'file') {
      d.classList.add('file');
      const c = document.createElement('div'); c.className = 'filecard'; c.setAttribute('role', 'button');

      const ext = (name.includes('.') ? name.split('.').pop() : 'FILE').toLowerCase().slice(0, 4);
      const badge = document.createElement('div');
      badge.className = 'ext ' + (ext === 'pdf' ? 'pdf' : /^(doc|docx|odt|rtf)$/.test(ext) ? 'doc' : /^(xls|xlsx|csv|ods)$/.test(ext) ? 'xls' : /^(ppt|pptx|odp)$/.test(ext) ? 'ppt' : '');
      badge.textContent = ext.toUpperCase();

    } else if (m.type === 'location') {
      d.classList.add('loc');
      const lat = Number(m.lat), lng = Number(m.lng); // siempre números: nunca se inserta texto ajeno en el enlace

        const a = document.createElement('a'); a.className = 'locard'; a.target = '_blank'; a.rel = 'noopener noreferrer';

        box.append(t, s, go); a.append(pin, box); d.appendChild(a);

  const fmtSize = (n) => { n = Number(n) || 0; return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; };
  const nativeCap = () => (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins : null);

  /* Guardar / abrir un archivo: en la app Android se abre el menú "Abrir con…"; en el navegador se descarga */
  async function saveFile(blob, name, id) {
    const cap = nativeCap();
    if (cap && cap.Filesystem && cap.Share) {
      const dataUrl = await blobToDataURL(blob);
      const safe = String(name).replace(/[^\w.\- ]+/g, '_');
      const r = await cap.Filesystem.writeFile({ path: 'fire/' + id + '/' + safe, data: dataUrl.split(',')[1], directory: 'CACHE', recursive: true });
      await cap.Share.share({ title: name, url: r.uri, dialogTitle: 'Abrir o guardar' });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  }

  function videoMeta(file) {
    return new Promise((res) => {
      const url = URL.createObjectURL(file);
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'metadata';
      let done = false;
      const finish = (o) => { if (done) return; done = true; clearTimeout(t); URL.revokeObjectURL(url); res(o); };
      const t = setTimeout(() => finish({ poster: '', dur: 0 }), 6000);
      v.onloadedmetadata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch { finish({ poster: '', dur: v.duration || 0 }); } };
      v.onseeked = () => {
        try {
          const s = Math.min(1, 320 / Math.max(v.videoWidth, v.videoHeight, 1));
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(v.videoWidth * s)); c.height = Math.max(1, Math.round(v.videoHeight * s));
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          finish({ poster: c.toDataURL('image/jpeg', 0.6), dur: v.duration || 0 });
        } catch { finish({ poster: '', dur: v.duration || 0 }); }
      };
      v.onerror = () => finish({ poster: '', dur: 0 });
      v.src = url;
    });
  }
  function checkFile(f) {

    if (f.size > MAX_FILE) { toast('Máximo 10 MB por archivo. Este pesa ' + fmtSize(f.size)); return false; }

    return true;

  /* Ubicación: se pide confirmación y se envía una sola vez (no es en tiempo real) */
  async function shareLocation() {
    if (!currentChat) return;
    if (!navigator.geolocation) return toast('Este dispositivo no permite obtener la ubicación');
    const ok = await confirmBox('Compartir ubicación', 'Vas a enviar tu ubicación actual a ' + currentChat + '. Se envía una sola vez, no se comparte en tiempo real.', 'Enviar');
    if (!ok) return;
    toast('Obteniendo ubicación…');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        $('toast').classList.remove('on');
        sendPayload({ type: 'location', lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5), acc: pos.coords.accuracy });
      },
      (err) => toast(err.code === 1 ? 'Permiso de ubicación denegado. Actívalo en los ajustes.' : 'No se pudo obtener la ubicación. Intenta de nuevo.'),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
    );
  }
  $('file').onchange = async () => {
    const f = $('file').files[0]; $('file').value = '';
    if (!f || !currentChat) return;
    if (!f.type.startsWith('image/')) return toast('Elige una imagen');
    try { sendPayload({ type: 'image', data: await compressImage(f) }); }
    catch (e) { toast(e.message || 'No se pudo leer la imagen'); }
  };
  async function compressImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen')); i.src = url; });
      let max = 1280, q = 0.75, data;
      for (let n = 0; n < 6; n++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < MAX_DATA * 0.75) return data;
        max *= 0.8; q = Math.max(0.4, q - 0.08);
      }
      return data;
    } finally { URL.revokeObjectURL(url); }
  }

  /* Mensajes de voz: toca el micrófono, habla, toca enviar */
  const MAX_SECONDS = 60;
  let rec = null;
  const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  function showRec(on) { $('rec').hidden = !on; form.hidden = on; }

  $('mic').onclick = async () => {
    if (rec || !currentChat) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return toast('Este navegador no permite grabar audio');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return toast('No se pudo usar el micrófono. Revisa el permiso.'); }
    const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
    const r = { mr, stream, chunks: [], start: Date.now(), cancelled: false, timer: null };
    rec = r;
    mr.ondataavailable = (e) => { if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(r.timer);
      if (rec === r) rec = null;
      showRec(false);
      const secs = (Date.now() - r.start) / 1000;
      if (r.cancelled || secs < 0.6) return;
      const blob = new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' });
      sendPayload({ type: 'audio', data: await blobToDataURL(blob), dur: Math.round(secs) });
    };
    r.timer = setInterval(() => {
      const s = (Date.now() - r.start) / 1000;
      $('rec-time').textContent = fmt(s);
      if (s >= MAX_SECONDS) $('rec-send').click();
    }, 200);
    $('rec-time').textContent = '0:00';
    showRec(true);
    mr.start();
  };
  $('rec-send').onclick = () => { if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); };
  function cancelRec() { if (rec) { rec.cancelled = true; if (rec.mr.state !== 'inactive') rec.mr.stop(); } }
  $('rec-cancel').onclick = cancelRec;

  /* ---------- Eventos en tiempo real ---------- */
  backend.on('message', (m) => {
    if (!session) return;
    const mine = m.from === session.username;
    const other = mine ? m.to : m.from;
    const list = (cache[other] = cache[other] || []);
    if (list.some((x) => x.id === m.id)) return;
    list.push(m);
    if (currentChat === other) {
      const box = $('messages');
      box.appendChild(bubble(m)); box.scrollTop = box.scrollHeight;
    } else if (!mine) {
      unread[other] = (unread[other] || 0) + 1;
      if (!currentChat) loadUsers();
    }
    if (!mine && (document.hidden || currentChat !== other)) incoming(m, other);
  });
  backend.on('presence', () => { if (!currentChat) loadUsers(); });

  /* =====================  PERFIL  ===================== */
  let myProfile = null, pendingPhoto; // pendingPhoto: undefined = sin cambio, '' = quitar, 'data:...' = nueva
  async function loadMyProfile() {
    myProfile = await backend.getProfile();
    setAvatar($('me-btn'), myProfile.displayName, myProfile.photo);
  }
  function curPhoto() { return pendingPhoto === undefined ? myProfile.photo : pendingPhoto; }
  /* ---------- Panel de administrador ---------- */
  const fdate = (t) => t ? new Date(t).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  async function renderAdmin() {
    const box = $('admin-list'); box.innerHTML = '';
    let list;
    try { list = await backend.adminListUsers(); } catch (e) { toast(e.message || 'Sin permiso'); show('s-profile'); return; }
    $('admin-sub').textContent = list.length + (list.length === 1 ? ' cuenta' : ' cuentas');
    const note = document.createElement('div'); note.className = 'admin-note';
    note.textContent = 'Las contraseñas no se pueden ver: se guardan cifradas y nadie, ni tú, puede leerlas. Si alguien la olvida, usa "¿Olvidaste tu contraseña?" con su correo.';
    box.appendChild(note);
    for (const u of list) {
      const c = document.createElement('div'); c.className = 'acct';
      const top = document.createElement('div'); top.className = 'top';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = u.displayName; top.appendChild(nm);
      const tag = (t, k) => { const s = document.createElement('span'); s.className = 'tag ' + k; s.textContent = t; top.appendChild(s); };
      if (u.admin) tag('ADMIN', 'ok');
      tag(u.verified ? 'Confirmado' : 'Sin confirmar', u.verified ? 'ok' : 'warn');
      if (u.blocked) tag('Bloqueado', 'bad');
      const em = document.createElement('div'); em.className = 'em'; em.textContent = u.email;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = 'Creada: ' + fdate(u.created) + ' · Último acceso: ' + fdate(u.lastLogin) + ' · Mensajes enviados: ' + u.sent;
      c.append(top, em, meta);
      if (!u.admin) {
        const acts = document.createElement('div'); acts.className = 'acts';
        const b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = u.blocked ? 'Desbloquear' : 'Bloquear';
        b1.onclick = async () => { try { await backend.adminSetBlocked(u.id, !u.blocked); renderAdmin(); } catch (e) { toast(e.message); } };
        const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'danger'; b2.textContent = 'Eliminar';
        b2.onclick = async () => {
          if (!(await confirmBox('Eliminar cuenta', 'Se borrará la cuenta de ' + u.email + ' y sus mensajes. No se puede deshacer.', 'Eliminar', 'Cancelar'))) return;
          try { await backend.adminDelete(u.id); toast('Cuenta eliminada'); renderAdmin(); } catch (e) { toast(e.message); }
        };
        acts.append(b1, b2); c.appendChild(acts);
      }
      box.appendChild(c);
    }
  }
  $('open-admin').onclick = () => { show('s-admin'); renderAdmin(); };
  $('admin-back').onclick = () => show('s-profile');
  function openProfile() {
    if (!myProfile) return;
    pendingPhoto = undefined;
    $('p-name').value = myProfile.displayName; $('p-about').value = myProfile.about; $('p-user').value = myProfile.email;
    setAvatar($('p-avatar'), myProfile.displayName, myProfile.photo);
    $('p-photo-remove').hidden = !myProfile.photo;
    $('open-admin').hidden = !myProfile.isAdmin;
    ['pw-old', 'pw-new', 'pw-new2'].forEach((id) => ($(id).value = ''));
    document.querySelector('details.pw').open = false;
    show('s-profile');
  }
  $('me-btn').onclick = openProfile;
  $('profile-back').onclick = () => show('s-users');
  $('p-photo-btn').onclick = $('p-avatar').onclick = () => $('p-file').click();
  $('p-name').addEventListener('input', () => { if (!curPhoto()) setAvatar($('p-avatar'), $('p-name').value || myProfile.username, ''); });
  $('p-file').onchange = async () => {
    const f = $('p-file').files[0]; $('p-file').value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return toast('Elige una imagen');
    try {
      pendingPhoto = await profilePhoto(f);
      setAvatar($('p-avatar'), $('p-name').value, pendingPhoto);
      $('p-photo-remove').hidden = false;
    } catch (e) { toast(e.message || 'No se pudo leer la imagen'); }
  };
  $('p-photo-remove').onclick = () => {
    pendingPhoto = ''; setAvatar($('p-avatar'), $('p-name').value || myProfile.username, ''); $('p-photo-remove').hidden = true;
  };
  // Foto de perfil: recorte cuadrado centrado, 256 px, JPEG liviano (cabe de sobra en el perfil)
  async function profilePhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen')); i.src = url; });
      const side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      let size = 256, q = 0.82, data;
      for (let n = 0; n < 6; n++) {
        const c = document.createElement('canvas'); c.width = c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < 45000) return data;
        q = Math.max(0.5, q - 0.1); size = Math.round(size * 0.85);
      }
      return data;
    } finally { URL.revokeObjectURL(url); }
  }
  $('p-save').onclick = async () => {
    try {
      const patch = { displayName: $('p-name').value, about: $('p-about').value };
      if (pendingPhoto !== undefined) patch.photo = pendingPhoto;
      myProfile = await backend.updateProfile(patch);
      pendingPhoto = undefined;
      setAvatar($('me-btn'), myProfile.displayName, myProfile.photo);
      $('p-name').value = myProfile.displayName;
      toast('Perfil actualizado');
    } catch (e) { toast(e.message || 'No se pudo guardar'); }
  };
  $('pw-save').onclick = async () => {
    const a = $('pw-old').value, n = $('pw-new').value, n2 = $('pw-new2').value;
    if (!a || !n) return toast('Completa los campos');
    if (n !== n2) return toast('Las contraseñas nuevas no coinciden');
    try {
      await backend.changePassword(a, n);
      ['pw-old', 'pw-new', 'pw-new2'].forEach((id) => ($(id).value = ''));
      document.querySelector('details.pw').open = false;
      toast('Contraseña cambiada');
    } catch (e) { toast(e.message || 'No se pudo cambiar'); }
  };

  /* =====================  NOTIFICACIONES  =====================
     - App abierta pero en otro chat: aviso arriba (banner) + vibración.
     - App en segundo plano: notificación del sistema (nativa en el APK, Notification API en el navegador).
     - App cerrada del todo: requiere "push" (Firebase Cloud Messaging) -> se conecta junto con Firebase. */
  const pref = {
    mem: {},
    get(k) { try { const v = localStorage.getItem(k); return v === null ? this.mem[k] ?? null : v; } catch { return this.mem[k] ?? null; } },
    set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  };
  const Notifs = (() => {
    const native = () => (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins : null);
    let onOpen = () => {};
    const n0 = native();
    if (n0 && n0.LocalNotifications) {
      n0.LocalNotifications.addListener('localNotificationActionPerformed', (e) => {
        const c = e && e.notification && e.notification.extra && e.notification.extra.chat;
        if (c) onOpen(c);
      });
    }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.chat) onOpen(e.data.chat); });
    }
    return {
      onOpen(fn) { onOpen = fn; },
      supported() { const n = native(); return !!(n && n.LocalNotifications) || 'Notification' in window; },
      async permission() {
        const n = native();
        if (n && n.LocalNotifications) { const r = await n.LocalNotifications.checkPermissions(); return r.display === 'granted' ? 'granted' : r.display === 'denied' ? 'denied' : 'default'; }
        return 'Notification' in window ? Notification.permission : 'denied';
      },
      async request() {
        const n = native();
        if (n && n.LocalNotifications) { const r = await n.LocalNotifications.requestPermissions(); return r.display === 'granted' ? 'granted' : 'denied'; }
        return Notification.requestPermission();
      },
      async show(title, body, chat) {
        const n = native();
        if (n && n.LocalNotifications) {
          await n.LocalNotifications.schedule({ notifications: [{ id: Date.now() % 2000000000, title, body, extra: { chat } }] });
          return;
        }
        if ('serviceWorker' in navigator) {
          try {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg && reg.showNotification) { await reg.showNotification(title, { body, tag: chat, icon: 'icon.png', data: { chat } }); return; }
          } catch {} // sin service worker (p. ej. archivo local): se usa el método directo
        }
        const nt = new Notification(title, { body, tag: chat, icon: 'icon.png' });
        nt.onclick = () => { window.focus(); onOpen(chat); nt.close(); };
      },
    };
  })();

  async function openChatFromAlert(name) {
    if (!session) return;
    if (!users.length) await loadUsers();
    openChat(name);
  }
  Notifs.onOpen(openChatFromAlert);

  const notifOn = () => pref.get('fire_notif') === 'on';
  function paintBell() { $('bell').textContent = notifOn() ? '🔔' : '🔕'; }
  $('bell').onclick = async () => {
    if (notifOn()) { pref.set('fire_notif', 'off'); paintBell(); return toast('Notificaciones desactivadas'); }
    if (!Notifs.supported()) return toast('Este navegador no permite notificaciones');
    let perm = await Notifs.permission();
    if (perm === 'default') perm = await Notifs.request();
    if (perm === 'granted') { pref.set('fire_notif', 'on'); toast('Notificaciones activadas'); }
    else toast('Permiso denegado. Actívalo en los ajustes del teléfono.');
    paintBell();
  };

  let bannerTimer;
  function banner(other, body) {
    const info = userInfo(other);
    const b = $('banner');
    b.innerHTML = '';
    const av = document.createElement('div'); av.className = 'avatar'; setAvatar(av, info.displayName || other, info.photo);
    const bt = document.createElement('div'); bt.className = 'bt';
    const bn = document.createElement('div'); bn.className = 'bn'; bn.textContent = info.displayName || other;
    const bb = document.createElement('div'); bb.className = 'bb'; bb.textContent = body;
    bt.append(bn, bb); b.append(av, bt);
    b.onclick = () => { b.hidden = true; openChatFromAlert(other); };
    b.hidden = false;
    clearTimeout(bannerTimer); bannerTimer = setTimeout(() => (b.hidden = true), 4500);
  }
  function incoming(m, other) {
    const body = previewOf(m);
    if (document.hidden) {
      if (notifOn()) Notifs.show(shownName(other), body, other).catch(() => {});
    } else {
      banner(other, body);
      if (navigator.vibrate) { try { navigator.vibrate(60); } catch {} }
    }
  }

  async function start() {
    show('s-users'); loadUsers(); paintBell(); loadMyProfile();
    // primera vez: ofrecer las notificaciones
    if (pref.get('fire_notif') === null && Notifs.supported()) {
      pref.set('fire_notif', 'off');
      const yes = await confirmBox('Notificaciones', '¿Quieres recibir un aviso cuando alguien te escriba?', 'Activar', 'Ahora no');
      if (yes) $('bell').click();
    }
  }
  Promise.resolve(backend.init()).then((saved) => { if (saved) { session = saved; start(); } });
})();
</script>
